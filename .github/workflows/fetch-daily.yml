name: 每日抓取股市資料

"on":
  schedule:
    # 10:00 UTC = 台北時間 18:00，平日執行；晚一點跑是為了讓 TWSE/TPEx 的三大法人與
    # 融資融券報表有足夠時間公布（實測發現這兩份報表常常比大盤指數晚公布）。
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "要抓取/補齊的日期（YYYY-MM-DD），留空預設抓今天"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch today's data
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/fetch_daily.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/fetch_daily.py
          fi

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "沒有新資料，略過 commit。"
          else
            git commit -m "data: update $(date -u +%Y-%m-%d)"
            git push
          fi
