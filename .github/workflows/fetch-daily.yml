name: 每日抓取股市資料

"on":
  schedule:
    # 08:30 UTC = 台北時間 16:30，平日執行；這個時間點三大法人買賣超通常已經公布，
    # 融資融券可能還沒有——每次執行都是全量抓取，缺的欄位下一個時段會自動補上。
    - cron: "30 8 * * 1-5"
    # 13:30 UTC = 台北時間 21:30，平日執行；這個時間點融資融券通常也公布了（實測約
    # 21:10 前後），用來補上第一個時段可能還缺的資料。
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "要抓取/補齊的日期（YYYY-MM-DD），留空預設抓今天"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch today's data
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/fetch_daily.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/fetch_daily.py
          fi

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "沒有新資料，略過 commit。"
          else
            git commit -m "data: update $(date -u +%Y-%m-%d)"
            git push
          fi
